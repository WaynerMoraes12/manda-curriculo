<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <title>Ilustração do aviso azul do Windows depois de Mais informações, com o botão Executar assim mesmo circulado</title>
  <rect width="640" height="400" rx="16" fill="#1c5cab"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="44" y="84" font-size="31" font-weight="300">O Windows protegeu o computador</text>
    <rect x="44" y="118" width="528" height="13" rx="6.5" fill-opacity="0.42"/>
    <rect x="44" y="143" width="402" height="13" rx="6.5" fill-opacity="0.42"/>
    <text x="44" y="210" font-size="19" fill-opacity="0.85">Aplicativo:</text>
    <text x="160" y="210" font-size="19">MandaCurriculo-win-Setup.exe</text>
    <text x="44" y="244" font-size="19" fill-opacity="0.85">Fornecedor:</text>
    <text x="160" y="244" font-size="19">Fornecedor desconhecido</text>
    <rect x="212" y="318" width="214" height="46" rx="5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="319" y="347.5" font-size="18" text-anchor="middle">Executar assim mesmo</text>
    <rect x="440" y="318" width="160" height="46" rx="5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="520" y="347.5" font-size="18" text-anchor="middle">Não executar</text>
  </g>
  <path d="M398 304C350 296 248 298 212 309c-27 8-29 51 4 62 40 13 181 10 215-6 26-12 21-49-12-58-15-4-33-5-50-5" fill="none" stroke="#ffe04b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
